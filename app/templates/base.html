<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        UREMBO COLLECTIONS
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<!-- =========================
     TOP NAVBAR
========================= -->

<nav class="kwetu-navbar">

    <div class="brand">

        <strong>
            UREMBO COLLECTIONS™
        </strong>

        <small>
            Distributor Intelligence
        </small>

    </div>

    <div class="nav-links">

        <a href="{{ url_for('dashboard.dashboard') }}">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a href="{{ url_for('agents.agents') }}">
            <i class="bi bi-people"></i>
            Agents
        </a>

        <a href="{{ url_for('sim.sim_issuance') }}">
            <i class="bi bi-sim"></i>
            SIM Intelligence
        </a>

        <a href="{{ url_for('performance.performance') }}">
            <i class="bi bi-bar-chart"></i>
            Performance
        </a>

        <a href="{{ url_for('email.dashboard') }}">
            <i class="bi bi-envelope"></i>
            Email Intelligence
        </a>

    </div>

    <div class="user-menu">

        <span>
            Welcome {{ session.get('username', 'Guest')|title }} 👋
        </span>

        <a href="{{ url_for('auth.logout') }}">
            Logout
        </a>

    </div>

</nav>

<!-- =========================
     PAGE CONTENT
========================= -->

<main class="main-container">

    {% block content %}

    {% endblock %}

</main>

<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    Powered by Kwetu Partners Ltd. © 2026

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
