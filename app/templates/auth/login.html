<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UREMBO COLLECTIONS - Login</title>
</head>

<body>

    <h1>UREMBO COLLECTIONS</h1>

    <h3>Distributor Intelligence Platform</h3>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST" action="/login">

        <p>
            <label>Username</label><br>
            <input
                type="text"
                name="username"
                required>
        </p>

        <p>
            <label>Password</label><br>
            <input
                type="password"
                name="password"
                required>
        </p>

        <button type="submit">
            Login
        </button>

    </form>

</body>
</html>
